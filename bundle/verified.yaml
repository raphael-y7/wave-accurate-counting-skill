  card: cards/jingzhun-trade-plan-skill.md
  frontmatter:
    description: |
      当用户说“帮我做一份交易计划/现在该不该买卖/止损目标仓位怎么定/这笔交易风险收益比如何”时使用；仅当需要完整、多要素整合时使用，若只问某个顶部的止损/目标，优先顶部捕捉。按八步生成计划表：浪级定位→结构判定→定势→入场（具备结束条件试单/确立结束加仓）→止损（极值外1～2点）→目标（下一级结构结束）→仓位（按确定性与止损距离）→失效（关键点破位/结构失败）。多解时标“待确认/轻仓”，无技术止损则不做。具体细节调用兄弟能力，但模板自身完整。
