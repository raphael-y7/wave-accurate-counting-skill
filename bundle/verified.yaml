- capability_id: cap.wave-accurate-counting-skill.trade-plan-builder
  revision: 1
  status: active
  slug: jingzhun-trade-plan-skill
  title: 交易计划整合
  importance: critical
  importance_rationale: 对应 task-15/task-16；用户最终需要一份可执行、可复核的计划，本能力把分散规则整合为模板。
  one_liner: 按浪级→结构→势→入场→止损→目标→仓位→失效八步生成可复核交易计划。
  intents: [生成交易计划, 制定买卖策略, 计算止损目标仓位, 复盘交易计划]
  keywords: [交易计划, 入场, 止损, 目标位, 仓位, 失效条件, trading plan]
