entry:
  name: wave-accurate-counting-skill
  description: |
    陈晓东《精准数浪》内部结构分析体系的单一入口。先定浪级与结构，再判“具备结束条件/确立结束”，在推动浪顶部或调整浪底部用极值外1～2点技术止损入场，目标为下一级结构结束，并按结构确定性配仓位。
    触发：用户提到数浪、浪级、内部结构、推动浪/调整浪、剪刀式/镰刀式/双节棍式、具备结束条件、浪中浪、顶底捕捉、波浪理论买卖点、技术止损、仓位控制，或要求用波浪结构分析某只股票/指数/期货/黄金。
    不适用：纯基本面、消息面、资金流、盘口/高频；无K线数据或流动性极差的品种；要求保证收益或替代个人决策的请求。
  core_principles:
    - 先级别后结构，先大级别后小级别；级别错则买卖点、止损、目标全错。
    - 具备结束条件≠确立结束：前者只可试单，后者才加仓。
    - 买卖点在结构结束临界点；技术止损放所交易浪极值外1～2点。
    - 目标位是下一级结构的结束条件，不用固定盈亏比猜目标。
    - 结构确定性决定仓位；确定性不足只轻仓、试单或回避。
    - 调整结构会演变，必须用关键点突破逐一排除替代分解。
    - 小级别服从大级别；结构变则支撑阻力、止损与仓位同步迁移。
  out_of_scope:
    - 不含基本面、消息面、资金流、行业与估值分析。
    - 不预测无结构的随机波动，不提供收益保证。
    - 不替代用户的下单决策与风险承受判断。
    - 不适用于缺乏K线数据或流动性极差的品种。
  stop_conditions:
    - 关键点被突破且结构必须重标，原交易计划失效。
    - 数据不足，无法完成次一级结构细分，级别判定只能标“未确认”。
    - 找不到技术止损，或技术止损空间大于可预见目标空间。
    - 同一段走势存在多种等价分解，且无法用关键点突破收敛。
router_entry:
  name: wave-accurate-counting-skill-router
  description: |
    《精准数浪》来源路由入口：收录逐级数浪、结束条件、顶底捕捉、调整模式库、复杂浪中浪、三角形、组合结构、顺势仓位、多周期一致性、延长浪、交易计划等12张能力卡。
    触发：用户提到陈晓东、精准数浪、内部结构数浪、剪刀式/镰刀式/双节棍式、浪中浪、三角形买卖点、组合结构、延长浪、支撑阻力迁移等“模式识别/进阶结构”问题，先由本入口分派到对应能力卡。
    不适用：明确要求单一动作（如只数浪、只判结束、只做计划）时，优先直接调用对应的晋级 Skill，避免路由层重复触发。
